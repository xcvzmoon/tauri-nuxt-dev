name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Check package
        run: |
          pnpm check
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=''
          if [ -f CHANGELOG.md ]; then
            notes=$(awk -v tag="$TAG" '
              $0 == "## " tag { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes"
          fi
