name: Bug Report
description: Report a defect or unexpected behavior in tauri-nuxt-dev
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce it.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched existing issues and this bug has not been reported.
          required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: The commit SHA or version you are running.
      placeholder: 'e.g. 74ab7d0'
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and Version
      placeholder: 'e.g. Node.js 24.21.0 on pnpm 12.4.1'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run the command
        2. ...
        3. See the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional Context
